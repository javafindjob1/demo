-- |cffea9f03猫灵|r
O001 = "由自然的地之力给养而来的猫灵对魔蚀并没有那么感兴趣。它只是在随意游玩，碰巧遇到了旅行者们，又碰巧心情好，就加入了小队。对它来说，没有比自由和快乐更重要的事情了。"
O00H = "·提高|cfff4606c10|r点基础移动速度，|cfff4606c10%|r基础属性和基础属性成长。|n·提高|cfff4606c30%|r攻击速度|cfff4606c上限|r，每|cfff4606c1%|r攻击速度上限提高|cfff4606c0.2%|r攻击速度获取效率。|n·崩山击每道震荡波的伤害提高|cfff4606c20%|r。|n·猫灵嘲笑的生命回复提高|cfff4606c30%|r，触发猫返的判定时间延长至|cfff4606c2|r秒，附加的猫返状态提高|cfff4606c50%|r的生命回复量，并附加|cfff4606c5×技能等级|r的护甲。|n·岩碎的伤害提高|cfff4606c20%|r，每次学习岩碎会额外提供|cfff4606c3%|r的|cfff4606c法术穿透|r。|n·附加的猫返状态提高|cfff4606c50%|r的生命回复量，并附加|cfff4606c5×技能等级|r的护甲。|n·崩山裂地击提高|cfff4606c30%|r的伤害，触发余震时，余震次数|cfff4606c+2|r。|n·添加一件|cffff9900神代|r特殊装备。"
-- |cfff4606c重炮手|r
O002 = "莎奈是来自其他国家的精英重炮手。在听说这里有长达几年没有解决的散播性灾难后，他们派出莎奈来到大陆彼岸进行帮助和调查，期望阻止魔蚀蔓延到本土。"
-- |cfff7f295天罚之烁|r
H00S = "帕莉丝是无依无靠的孤女，被自顾不暇的村民们送到教堂，却意外幸存下来，并领悟了罚光之力。她感恩神的拯救，并立誓从此成为神仆。在魔蚀中，可怕的怪物吞噬着一切，这对她来说是痛苦的折磨。因此她离开没人造访的教堂，将毫无保留的关怀献给孤弱与幼小。她无私的付出使得冒险队中出现了一种极其融洽的氛围。"
-- |cfff4606c燎原赤剑|r
E01Q = "身负家仇与故土的灰烬，伊芙利特是一位追寻魔蚀根源的红衣剑士。她以凡人之躯驾驭着危险的火焰魔法，手中红剑所向，誓以烈焰焚尽一切污秽。她行走于黑暗之中，是为那些被吞噬的生命讨回公道，也为在绝望之地燃起一丝永不熄灭的火光。"
-- |cff8bfdf6史莱姆国王|r
E01R = "没人会在意它的故事，也没人想知道它来自哪个泥泞的沼泽或是哪座被遗忘的遗迹。|n在那些自诩高贵的英雄眼中，它，不过只是一只史莱姆。"
-- |cfff4606c天籁织韵|r
H00U = "缪斯是一位来自神秘森林的精灵族少女，她拥有操控音律和编织魔法的能力，音符既是她的朋友，也是她用以保护家园的武器。魔蚀肆虐的世界里，她用调谐的魔法为冒险者们带来胜利的希望。"
-- |cffbeedc7幻影魔猎|r
E004 = "达克尼斯来自于以速度著称的幻影族，他的成绩在族群的培养体制中一直无人能比。在结业仪式上，因魔蚀而变异的怪物如潮涌般侵入族群，族人奋起抵抗，但最终只有达克尼斯侥幸逃脱。消沉了几年后，他决定募集伙伴，前往魔蚀爆发的中心解决这场旷世灾难。"
-- |cfff7f295巡星|r
H00Y = "诺拉来自一个早已与世界隔绝、被遗忘在星海之中的遥远大陆。她自幼便目睹了神秘的魔蚀现象如何缓慢地吞噬她故乡的星空与生机。年仅十六岁的她，毅然肩负起沉重的使命，独自踏上了通往未知领域的旅程。她唯一的目标，就是追寻魔蚀的源头，并找到彻底终结它的方法，以此挽救她日渐黯淡的家园。"
-- |cff8bfdf6剑舞双月|r
E008 = "蓓雷德是遥远剑之都的皇家剑士。遗失王都中心爆发魔蚀时，她还在祖国抵御着异邦入侵者的进攻。几年过去，异邦入侵者已被歼灭。当魔蚀的消息传到剑之都时，为防患于未然，她立刻踏上了旅途。一路上，她以自己独特的剑术铲除怪物，帮助了许多居民。"
E01K = "·提高|cfff4606c5|r点基础移动速度，|cfff4606c10%|r基础属性和基础属性成长，|cfff4606c10%|r攻击速度上限，降低技能魔法值消耗。|n·月升·疾伤害系数提高|cfff4606c20%|r，且提高攻击速度的效果|cfff4606c不会|r再被净化，施放后|cfff4606c0.3|r秒内受击将反击，学习时额外附加|cfff4606c攻击速度|r，发动效果|cfff4606c不需|r吸收|cfff4606c月落|r。|n·月升·凶伤害系数提高|cfff4606c20%|r，攻击力和生命回复效果提高，且效果|cfff4606c不会|r再被净化，施放后|cfff4606c1.8|r秒内格挡所有伤害，发动效果|cfff4606c不需|r吸收|cfff4606c月落|r。|n·月落四影伤害提高|cfff4606c10%|r，额外附加|cfff4606c眩晕|r状态。|n·月震范围提高至|cfff4606c800|r码，会将|cfff4606c冷却时间缩短|r转化为|cfff4606c物理穿透|r。|n·月华效果大幅变化。|n·添加两件|cffff9900神代|r特殊装备。"
-- |cffbeedc7剑影|r
O00M = "在自己的国度里，他曾是以为居无定所的浪人剑客，凭借精妙的剑术和强大的力量浪迹天涯。时空交叉，位面错乱，在一场酒醉过后他无意中闯入了魔蚀的世界。初到时的震撼并没有持续太久，他很快开始学习如何在陌生的大陆生存。他脱去身上格格不入的异国长跑，随手捡来的长剑成了他御敌的利器。"
