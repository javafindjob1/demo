[intros]
-- |cfff4606c狂战神|r
O000 = "|cffff00ff独行|r|n巴尔萨克出生在一个并未完全开化的部族，族人大多蠢笨而粗鲁。但魔蚀侵袭之严重，让这帮迟钝的蛮族人也意识到世界开始倾覆。为此，部族不得不派出部落里的精英前往大陆的中心探索魔蚀的原因，他就是其中一个。外面的世界比他想象的更糟糕。当他重归部落时，却发现这里已是一片废墟。"
O00R = "·提高|cfff4606c10|r点基础移动速度，|cfff4606c10%|r基础属性和基础属性成长，|cfff4606c10%|r攻击速度上限。|n·无畏跳斩改为|cfff4606c断|r，更改技能形态。|n·歼灭挥斩改为|cfff4606c裁|r，变为|cfff4606c被动|r技能，主动效果与断合并，提前获得普通攻击分裂效果，且分裂伤害提高|cfff4606c20%|r。|n·狂暴战魂改为|cfff4606c绝|r，初始便获得特殊剧情加成，且效果额外提高|cfff4606c20%|r，拥有额外强化效果。|n·风暴斧斩改为|cfff4606c刃|r，伤害系数提高|cfff4606c20%|r，持续时间提高|cfff4606c0.1|r秒，持续时间内|cfff4606c免疫|r任何伤害，且可以进行攻击，格挡概率提高到|cfff4606c25%|r。|n·刃舞改为|cfff4606c灭|r，各阶段暴击倍率提高|cfff4606c1|r，使绝可以附加普通攻击吸血和物理吸血。|n·添加一件|cffff9900神代|r特殊装备。|n|cffd6d5b7点击选择该单位开始游玩。|r"
-- |cffea9f03猫灵|r
O001 = "|cff00ff00自然之心|r|n由自然的地之力给养而来的猫灵对魔蚀并没有那么感兴趣。它只是在随意游玩，碰巧遇到了旅行者们，又碰巧心情好，就加入了小队。对他来说，没有比自由和快乐更重要的事了。"
O00H = "·提高|cfff4606c10|r点基础移动速度，|cfff4606c10%|r基础属性和基础属性成长。|n·提高|cfff4606c30%|r攻击速度|cfff4606c上限|r，每|cfff4606c1%|r攻击速度上限提高|cfff4606c0.2%|r攻击速度获取效率。|n·崩山击每道震荡波的伤害提高|cfff4606c20%|r。|n·猫灵嘲笑的生命回复提高|cfff4606c30%|r，触发猫返的判定时间延长至|cfff4606c2|r秒，附加的猫返状态提高|cfff4606c50%|r的生命回复量，并附加|cfff4606c5×技能等级|r的护甲。|n·岩碎的伤害提高|cfff4606c20%|r，每次学习岩碎会额外提供|cfff4606c3%|r的|cfff4606c法术穿透|r。|n·附加的猫返状态提高|cfff4606c50%|r的生命回复量，并附加|cfff4606c5×技能等级|r的护甲。|n·崩山裂地击提高|cfff4606c30%|r的伤害，触发余震时，余震次数|cfff4606c+2|r。|n·添加一件|cffff9900神代|r特殊装备。"
-- |cffbeedc7白银骑士|r
E011 = "|cffffcc00斯戴博安联邦|r|n斯里薇尔，斯戴博安联邦的骑士。她以凡人之躯，赢得了战神之契。她的剑下救赎了无数生灵。然而，蔓延的魔蚀与世间的苦难，让她目睹了世界滑向深渊的轨迹。当希望如退潮般消散，这位骑士做出了自己的选择：她将踏上一条无光之路，去直面并了结那个一直被世界畏惧与搁置的终极灾难。"
-- |cff8bfdf6工程大师|r
N02D = "|cffff00ff独行|r|n万是地精十兄弟中的老大。不同于他的兄弟们，万更喜欢研究机械和打造技术。此次他与冒险者们结伴，一方面是为解决魔蚀，让地精兄弟们的生意更加兴隆，另一方面也是为了研究如何将某些力量应用于生产生活中。"
N00E = "·提高|cfff4606c10|r点基础移动速度，|cfff4606c10%|r基础属性和基础属性成长。|n·暴雨火箭弹将射出射线，基础伤害提高|cfff4606c10|r，力量相关伤害提高|cfff4606c25%|r，作用范围提高|cfff4606c200|r码，每道射线击中怪物会回复自身|cfff4606c1%|r最大生命值。|n·工程机器人将制造机塔，机塔的基础攻击力提高，攻击间隔缩短|cfff4606c10%|r，且自身每|cfff4606c20|r点力量值可|cfff4606c额外|r提高机塔|cfff4606c1%|r攻击力，机塔存在时间提高|cfff4606c1.3|r秒。|n·增幅现在可以指定增幅属性，但是指定增幅的属性只有|cfff4606c85%|r，相对的，随机增幅的属性会额外提高|cfff4606c30%|r。|n·动力铠甲·激活会额外制造|cfff4606c2|r架机塔，其属性与工程机器人技能相同。|n·修改一件|cffff9900神代|r特殊装备。"
-- |cfff4606c烈斗|r
O003 = "|cffff0000极东之国烨煌|r|n来自极东之国烨煌的女斗士，是烨煌公认的、身负巨熊血统的天选之人。她那碾压性的武力，源于血脉，更源于一颗永无止境的争强之心。平静令她困倦，唯有在生死一线的战斗中，她才能真正感受到自我的存在。她踏入广阔的天地，加入形形色色的冒险队伍：这一切，都只为了追寻能与她匹敌的、足以让她燃烧殆尽的强敌。"
-- |cffea9f03岩之巨人|r
O004 = "|cffcc99ff蚀魔者|r|n探险家罗克在一次山中奇遇后，成为了自然的一部分：字面意义上的一部分。他的躯体呈现出岩石的冷硬与苔藓的湿润，与山脉、森林再无分别。当他返回人类城镇，他本身就成了一个行走的怪谈，一个被同胞畏惧的“他者”。昔日的同伴对他敬而远之，温暖的家园将他拒之门外。从那时起，罗克的目标改变了：他不再探索外部世界的未知，而是转向探寻自身命运的谜题：如何从一个“活着的异类”，重新变回一个能被世界接纳的“人”。"
O00J = "·提高|cfff4606c5|r点基础移动速度，|cfff4606c10%|r基础属性和|cfff4606c5%|r基础属性成长。|n·提高|cfff4606c20%|r攻击速度上限，每|cfff4606c1%|r攻击速度上限提高|cfff4606c0.2%|r攻击速度获取效率。|n·发动裂地重击后会回复|cfff4606c6%|r最大生命值。|n·添加一件|cffff9900神代|r特殊装备。"
-- |cff8bfdf6暗礁之龙|r
E01H = "|cff00ffff海潮卫戍|r|n在遥远的往昔，暗礁龙族曾是无可争议的七海之主。他们驾驭龙威，统御万流，其辉煌曾是海洋本身的声音。然而，荣光终被时光侵蚀，力量随潮水褪去，一场浩劫更令这古老龙族近乎化为历史中的一道剪影。美露莘，作为族群唯一的遗孤，背负着“最后海龙”的沉重冠冕。她纤柔而坚韧的身影，必须穿梭于沉没的古城与陌生的岸邦，去探索每一个被遗忘的角落，寻找那或许能使潮声再起的、关乎族群复兴的渺茫秘辛。"
-- |cffbeedc7幻影魔猎|r
E004 = "|cffff00ff独行|r|n达克尼斯来自于以速度著称的幻影族，他的成绩在族群的培养体制中一直无人能比。在结业仪式上，因魔蚀而变异的怪物如潮涌般侵入族群，族人奋起抵抗，但最终只有达克尼斯侥幸逃脱。消沉了几年后，他决定募集伙伴，前往魔蚀爆发的中心解决这场旷世灾难。"
-- |cff8bfdf6剑舞双月|r
E008 = "|cffffff00光谕圣堂|r·[剑]|n作为光谕圣堂的剑士，蓓雷德肩负着教主交付的重任：在魔蚀的阴影彻底笼罩世界前，探寻将其根除的方法。她并非被动执行命令，而是将这份职责内化为自己的信念。征途之中，她那独特的剑术既是为未来而战的利器，也是庇护当下的坚盾。她的存在，对于怪物即是挥之不去的审判，对于平民则是不期而遇的庇护。"
E01K = "·提高|cfff4606c5|r点基础移动速度，|cfff4606c10%|r基础属性和基础属性成长，|cfff4606c10%|r攻击速度上限，降低技能魔法值消耗。|n·月升·疾伤害系数提高|cfff4606c20%|r，且提高攻击速度的效果|cfff4606c不会|r再被净化，施放后|cfff4606c0.3|r秒内受击将反击，学习时额外附加|cfff4606c攻击速度|r，发动效果|cfff4606c不需|r吸收|cfff4606c月落|r。|n·月升·凶伤害系数提高|cfff4606c20%|r，攻击力和生命回复效果提高，且效果|cfff4606c不会|r再被净化，施放后|cfff4606c1.8|r秒内格挡所有伤害，发动效果|cfff4606c不需|r吸收|cfff4606c月落|r。|n·月落四影伤害提高|cfff4606c10%|r，额外附加|cfff4606c眩晕|r状态。|n·月震范围提高至|cfff4606c800|r码，会将|cfff4606c冷却时间缩短|r转化为|cfff4606c物理穿透|r。|n·月华效果大幅变化。|n·添加两件|cffff9900神代|r特殊装备。|n|cffd6d5b7点击选择该单位开始游玩。|r"
-- |cfff7f295耀光射手|r
H006 = "|cffff00ff独行|r|n尽管故乡耀光森林在魔蚀中得以幸免，但赫卡莉心中的正义却无法安眠。象征光明的她，若对世间的苦难视而不见，那便是对自身信念最深的背叛。她与光之精灵一同启程，主动踏入外部世界的黑暗。"
H009 = "·提高|cfff4606c10|r点基础移动速度，|cfff4606c10%|r基础属性和基础属性成长。|n·圣光箭的伤害提高|cfff4606c50%|r。|n·使用瞬光额外提高|cfff4606c（30+5%）×技能等级|r的敏捷值。|n·耀光圣矢的伤害提高|cfff4606c10%|r，并且有几率射出|cfff4606c深蓝光矢|r，造成|cfff4606c2|r倍法术伤害。|n·疾光提高|cfff4606c更多|r攻击速度，移动速度|cfff4606c翻倍|r，提供额外|cfff4606c50%|r的攻击速度上限。|n·耀光强化额外提高|cfff4606c10%|r光属性护甲的法术抗性效率。|n·添加一件|cffff9900神代|r特殊装备。"
-- |cfff4606c重炮手|r
O002 = "|cffffcc00斯戴博安联邦|r|n莎奈，斯戴博安联邦的精英重炮手。当这片大陆的灾难持续数年而未得解决时，联邦为防魔蚀蔓延至本土，派出了她：这位以重火力著称的战士，远渡重洋前来进行调查与援助。"
-- |cffea9f03极杀寂刃|r
E015 = "|cffff00ff独行|r|n一名神秘的刺客，据说他曾经是某个暗部组织的首领。由于魔蚀肆虐，他的组织所隶属的国家似乎已经灭亡，组织也被解散。无处可去的他决定踏上冒险旅途，希望找到自己的下一个归宿。"
E01P = "·提高|cfff4606c10|r点基础移动速度，|cfff4606c10%|r基础属性和基础属性成长。|n·|cfff4606c千机|r可幻化为|cffffff00光属性|r或|cffcc99ff暗属性|r。|n·|cfff4606c追袭|r造成伤害时，额外造成|cfff4606c2%×攻击力×技能等级|r的法术伤害。|n·计算克制属性时，|cfff4606c千机|r造成的二次克制计算系数增值提高|cfff4606c50%|r。|n·|cfff4606c幽影·无懈|r持续期间额外提供|cfff4606c30%|r法术伤害减免。|n·|cfff4606c追袭|r的冒险者等级系数由|cfff4606c40|r提高至|cfff4606c50|r。|n·添加一段对话。|n·添加一件|cffff9900神代|r特殊装备。"
-- |cffc552e6隐暗射手|r
N06G = "|cffff00ff独行|r|n在远离魔蚀大陆的彼端，暗之国屹立于永夜之中。那里能人辈出，而雅弥正是其中翘楚：一位精通隐暗箭术的精英弓箭手。一次任务中，她突感意识恍惚，再回神时，天地已非故土。紫夜化作青空，幽光换作烈日，熟悉的暗影荡然无存。历经探查，她明白自己已坠入异界。为寻归途，她暂掩乡愁，踏入一支异乡冒险者的队伍，在未知的土地上拉开了一场穿越世界的序幕。"
N06U = "·提高|cfff4606c10|r点基础移动速度，|cfff4606c10%|r基础属性成长。|n·隐暗魔箭更加|cfff4606c密集|r。|n·暗能震慑的伤害提高|cfff4606c20%|r，负面状态的|cfff4606c持续时间和强度|r提高。|n·暗能引爆变为|cfff4606c被动|r技能，伤害提高|cfff4606c150%|r，触发机率提高至|cfff4606c60%|r，触发后会根据|cfff4606c攻击力|r回复|cfff4606c生命值|r。|n·暗能强化为自身提供的攻击力提高|cfff4606c50%|r，对友方的效果提高|cfff4606c20%|r。|n·绝暗箭的大箭伤害提高|cfff4606c20%|r。|n·添加一件|cffff9900神代|r特殊装备。"
-- |cffbeedc7剑影|r
O00M = "|cffff00ff独行|r|n在自己的国度里，他曾是一位居无定所的浪人剑客，凭借精妙的剑术和强大的力量浪迹天涯。时空交叉，位面错乱，在一场酒醉过后他无意中闯入了魔蚀的世界。初到时的震撼并没有持续太久，他很快开始学习如何在陌生的大陆生存。他脱去身上格格不入的异国长跑，随手捡来的长剑成了他御敌的利器。"
-- |cfff7f295教宗|r
H007 = "|cffffff00光谕圣堂|r·[愈]|n在光谕圣堂，海里尔已将一生的漫长岁月，奉献给了那座神赐的静默岗位。然而，魔蚀的阴影顷刻间吞没了凡世的喧嚣，将亘古未有的危机推至他的面前。这位曾经的守望者，无法再安于一方净土。他毅然执起圣杖，决意踏出圣堂。他不仅要守护最后的信仰之光，更要成为引路之人，带领所有在黑暗中挣扎的子民，直至寻回失落的黎明。"
H00A = "·提高|cfff4606c5|r点基础移动速度，|cfff4606c10%|r基础属性和|cfff4606c5%|r基础属性成长。|n·提高|cfff4606c20%|r攻击速度上限。|n·灵光治愈会同时对治疗单位附近|cfff4606c300|r码范围内的敌方单位造成|cfff4606c治疗值×2|r的法术伤害。|n·灵光涟漪的冷却时间缩短|cfff4606c15%|r。|n·灵泽恩赐会为友方单位提供|cfff4606c20%|r全伤害增幅。|n·添加一件|cffff9900神代|r特殊装备。"
-- |cff8bfdf6人鱼公主|r
H00H = "|cff00ffff海潮卫戍|r|n深海之中，美人鱼公主梅洛以她的法术守护着王国最后的微光，成为抵御魔蚀侵扰的坚盾。但当连番的灾难让海洋的歌声逐渐沉寂，她意识到固守已是徒劳。为了夺回族的安宁，梅洛毅然告别故土，向着一切黑暗的起点：遗失王都进发。她不仅是公主，更愿成为照亮这漫漫长夜的明灯，为所有海洋生灵寻回希望的曙光。"
H00X = "·|cfff4606c潮涌|r结束后，可使用|cfff4606c潮流|r。|n·|cfff4606c水流冲击|r结束后，可使用|cfff4606c水流爆发|r。|n·|cfff4606c水弹|r施放后，可追加施放一颗|cfff4606c巨型水弹|r。|n·由于服用了魔药，水属性强化降低|cfff4606c28%|r（特殊的降低区间）。|n·由于魔药的作用，样貌发生改变，|cfff4606c芙尔蒂|r可能|cfff4606c认不出|r梅洛。|n·若拥有|cfff4606c人鱼形态的梅洛|r，泡沫将包裹全身，可|cfff4606c无视魔药的副作用|r，并获得|cfff4606c特殊的视觉效果|r。|n|n海巫婆给与了梅洛一种神奇的魔药，可以令鱼尾变成人类的双腿。"
-- |cffea9f03雷魂|r
E014 = "|cffcc99ff蚀魔者|r|n一场空前的雷暴将某个边陲小镇夷为平地，当救援者赶到时，整片焦土之上，只剩下一个活物：萨恩德。他从废墟中醒来，惊恐地发现自己的躯体发出了诡异的低鸣，皮肤上浮现出如同雷纹的烙印。他是唯一的幸存者，也是最诡异的谜题。萨恩德坚信，这场灾难与自己的异变，绝非自然所为，其背后必然与那侵蚀世界的“魔蚀”有关。为追寻真相，他步入了那些追寻魔蚀的冒险者之中。"
E01O = "·提高|cfff4606c10|r点基础移动速度，|cfff4606c10%|r基础属性。|n·|cfff4606c魔法回复|r提高|cfff4606c10|r点。|n·|cfff4606c连锁龙雷|r形态变化，伤害系数|cfff4606c提高|r，命中后可|cfff4606c回复|r自身生命值。|n·|cfff4606c雷电枝桠|r替换为|cfff4606c雷枪|r。|n·|cfff4606c狂电破空|r形态变化，伤害系数|cfff4606c提高|r。|n·|cfff4606c雷暴领域|r范围|cfff4606c扩大|r，可由雷枪附加|cfff4606c雷电护盾|r。|n·|cfff4606c狂电连袭|r形态变化，现在可以|cfff4606c主动学习|r，等级变为|cfff4606c8|r级。|n·部分落雷主动技能可以造成|cfff4606c震晕|r效果，部分可造成|cfff4606c净化|r效果。|n·所有落雷主动技能可|cfff4606c无视条件|r触发|cfff4606c额外伤害|r。|n·添加|cfff4606c2|r件|cffff9900神代|r特殊装备。"
-- |cffc552e6元素贤者|r
H005 = "|cffffcc00斯戴博安联邦|r|n来自斯戴博安联邦的她，以其神秘的兜帽装束、冰冷的姿态与惊人的占卜天赋而为人侧目。她一贯疏离，仿佛活在一层看不见的冰墙之后。然而，一次深度的冥想中，一个全新的、剧烈波动的未来景象强行闯入她的意识。那景象如此真切且迫近，令她无法再保持置身事外的冷漠。为此，这位观测命运者，决定亲自步入命运的洪流，加入了与之相关的冒险队伍。"
H00W = "·提高|cfff4606c10|r点基础移动速度，|cfff4606c10%|r基础属性和基础属性成长。|n·现在满足一定条件后，蜜丝提克可获得这个世界的|cfff4606c四种元素|r，每次|cfff4606c捡取|r一种元素将提高自身|cfff4606c对应元素|r技能的威力。|n·添加一件|cffff9900神代|r特殊装备。"
-- |cffbeedc7自然共鸣使|r
E016 = "|cff00ff00自然之心|r|n他有很多的身份和传说，他以各种面目出现，鹰隼、鹿、狼，甚至是亦可枯朽的古树，没有人能说清楚哪一个才是他的本质。他是自然的共鸣使，任何胆敢亵渎时光古树的生物，都是他的敌人。当魔物开始打扰到他幽静的家园时，他意识到自己该走出森林做些什么了。"
E01L = "·提高|cfff4606c10|r点基础移动速度，|cfff4606c10%|r基础属性和基础属性成长。|n·获得隐藏技能|cfff4606c自然共鸣|r：施放法术时有15%机率再施放一次。|n·灵核增强：获得灵格|cfff4606c自然共鸣使|r时，|cfff4606c拟态射击|r必定发动两次。|n·选取到灵格|cfff4606c自然共鸣使|r的条件放宽。|n·添加一件|cffff9900神代|r特殊装备。"
-- |cfff7f295天罚之烁|r
H00S = "|cffffff00光谕圣堂|r·[杖]|n她是光谕圣堂的圣女，执掌着惩戒邪恶的罚光之力。她本应是神意的代行者，但魔蚀中怪物肆虐、生灵涂炭的景象，却深深灼伤了她的心。这份痛苦让她意识到，她的信仰不应只存在于高高的祭坛之上。于是，她走下神坛，走入尘埃，将那曾用于制裁的神力，化为庇护孤弱的温暖光芒。她无私的关怀极具感染力，如同黑暗中点燃的烛火，自然地在冒险队中营造出一种彼此信任、亲如家人的融洽氛围。"
-- |cff8bfdf6慷慨之人|r
H00B = "|cffff0000极东之国烨煌|r|n菲朗特匹斯德出生于一个平凡的农民家庭，从小家人就教导他要慷慨无私。他从不为自己索取任何回报，总是将荣誉和奖励让给他人。他的慷慨不仅体现在物质上，更体现在他对待每一个人的尊重与关怀上。而他的行为激励着每一个遇到他的人，让他们相信，即使在这个充满挑战的世界中，善良和慷慨依然能够带来希望和光明。"
-- |cfff4606c天籁织韵|r
H00U = "|cffff0000极东之国烨煌|r|n缪斯是一位来自极东之国烨煌的精灵族少女，她拥有操控音律和编织魔法的能力，音符既是她的朋友，也是她用以保护家园的武器。魔蚀肆虐的世界里，她用调谐的魔法为冒险者们带来胜利的希望。"
-- |cfff7f295天眷素人|r
O00X = "|cffcc99ff蚀魔者|r|n通常来说，被魔蚀侵蚀的人类必定会异变成怪物。但艾达却是个例外，在魔蚀能量吞噬她的瞬间，她竟奇迹般地保留了人类形态，只从中获得了力量。更令人难以置信的是，艾达原本只是个普通少女，对如何掌控这份突如其来的力量一无所知。这场始于偶然的旅程将如何展开？无人能够预料。"
-- |cffc552e6血猩棘刺|r
O012 = "|cffff00ff独行|r|n萝丝芮梵，其名“血猩棘刺”，乃是为族群未来而战的吸血鬼贵族。当灾难“魔蚀”席卷人间，屠戮生灵，也断绝了血族延续的食粮。她手持长枪“蔷薇”，踏入这片死寂之地，并非为了慈悲，而是为了生存。她必须查明这场灾难的根源，为了吸血鬼不朽的未来，清扫一切障碍。无论是魔物，还是绝望，都将成为她枪下绽放的养料。"
-- |cfff7f295晨光之壁|r
O014 = "|cffffff00光谕圣堂|r·[盾]|n她来自彼岸大陆的光谕圣堂，乃是圣堂最坚固的盾。此次远渡重洋，并非为了征服，而是肩负着一项神圣的使命：追踪并探查那湮灭生灵、腐化大地的“魔蚀”的根源。她坚信，唯有理解这黑暗的本质，才能用光辉将其彻底净化。"
-- |cffbeedc7苍岚|r
O015 = "|cffcc99ff蚀魔者|r|n阿利斯泰尔曾是追逐风之自由的法师，直至魔蚀吞噬了他的家园。灾难的诅咒将他的形态扭曲成了鹤形灵体。如今，哀伤的风暴缠绕着他的羽翼，但风中仍回荡着他清晰的人类意识：一个被困在永恒宿命里，永不屈服的守护之魂。"
-- |cfff4606c燎原赤剑|r
E01Q = "|cffff0000极东之国烨煌|r|n身负家仇与故土的灰烬，伊芙利特是一位追寻魔蚀根源的烨煌剑士。她以凡人之躯驾驭着危险的火焰魔法，手中红剑所向，誓以烈焰焚尽一切污秽。她行走于黑暗之中，是为那些被吞噬的生命讨回公道，也为在绝望之地燃起一丝永不熄灭的火光。"
-- |cff8bfdf6史莱姆国王|r
E01R = "|cff00ff00自然之心|r|n没人会在意它的故事，也没人想知道它来自哪个泥泞的沼泽或是哪座被遗忘的遗迹。|n在那些自诩高贵的英雄眼中，它，不过只是一只史莱姆。"
-- |cfff7f295巡星|r
H00Y = "|cffff00ff独行|r|n诺拉来自一个早已与世界隔绝、被遗忘在星海之中的遥远大陆。她自幼便目睹了神秘的魔蚀现象如何缓慢地吞噬她故乡的星空与生机。年仅十六岁的她，毅然肩负起沉重的使命，独自踏上了通往未知领域的旅程。她唯一的目标，就是追寻魔蚀的源头，并找到彻底终结它的方法，以此挽救她日渐黯淡的家园。"
